# Runs the broker + Prometheus + Grafana together. `docker compose up` here
# is now fully self-contained - no need to `go run ./cmd/broker` first.
#
# The native workflow (running the broker yourself, then just `docker
# compose up` for the dashboard stack) still works too: prometheus.yml scrapes
# both this compose broker and host.docker.internal, and whichever one is
# actually running answers - the other just shows as a down target in
# Prometheus, which is harmless. That only holds because the container's
# metrics are published on host port 9102 rather than 9101 (see the broker's
# ports below). See docs/decisions.md for the reasoning.
#
# Usage, from this directory:
#   docker compose up
# Then open http://localhost:3000 (Grafana) - the "kafka-go" dashboard is
# already provisioned, no manual datasource setup or JSON import needed.

services:
  broker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "9092:9092"
      # The broker's /metrics is 9101 inside the container but published on
      # host port 9102, not 9101. Prometheus scrapes broker:9101 over
      # Docker's internal network and does not need a published port. If this
      # were "9101:9101", prometheus.yml's second target
      # (host.docker.internal:9101, meant for a natively-run broker) would
      # reach this same container through the published port, every metric
      # would be scraped twice, and the dashboard's sum() panels would read
      # exactly double. Keeping 9101 free on the host is what makes "only one
      # of the two targets is ever up" actually true.
      - "9102:9101"
    volumes:
      # Named volume, not a bind mount: record data and committed offsets
      # survive `docker compose down`/`up` and container restarts, matching
      # how the native `go run ./cmd/broker` workflow already behaves (its own
      # ./data directory persists on disk between runs). The topic list itself
      # is held in memory and is not rebuilt on startup yet (docs/plan.md,
      # evaluation bug 5), so topics must be created again after a restart.
      - broker-data:/app/data

  prometheus:
    image: prom/prometheus:latest
    depends_on:
      - broker
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      # host.docker.internal resolves out of the box on Docker Desktop
      # (Windows/Mac). This line is what makes it also resolve on Linux,
      # where it doesn't by default - harmless, already-correct no-op on
      # Docker Desktop, but keeps this reproducible for anyone else who
      # tries it.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    environment:
      # Anonymous admin access - this is a local dev dashboard, not a
      # deployed service with real users, so the default admin/admin login
      # flow would just be friction for zero real security benefit.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin

volumes:
  broker-data:
